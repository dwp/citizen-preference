{% extends "layouts/main.html" %}

{% block beforeContent %}

{{ govukBackLink({
      text: "Back",
      href: "javascript:window.history.back()"
  }) }}
  
  <ul class="dwp-language-toggle__list">
    <li class="dwp-language-toggle__list-item" aria-current="true"> <span class="govuk-body-s"> English  </span></li>
    <li class="dwp-language-toggle__list-item">    
    <a href="#" hreflang="cy" lang="cy" rel="alternate" class="govuk-link--no-visited-state" aria-label="Newid yr iaith ir Gymraeg">Cymraeg</a>
    </li>
  </ul>

{% endblock %}


{% block content %}

<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
  <h1 class="govuk-heading-l">
    What is your textphone number?
  </h1>

  <label class="govuk-label" for="textphone-number">
   Textphone number
  </label>
  <input class="govuk-input govuk-input--width-20" id="textphone-number" name="textphoneNumber" type="tex" autocomplete="tex">
</div>

<button class="govuk-button" value= "true" data-module="govuk-button" style="margin-bottom:50px;" onclick="check3()" >Continue</button>

</fieldset>

  </div>

  <script>
    function check3() {
      var element = document.getElementById('textphone-number');
      // sessionStorage.setItem('howWeConnect', `Textphone for the hard of hearing<br>${element.value}`);

      if (element.value) {
        sessionStorage.setItem('textphoneNumber', element.value)
        window.location.href = "/customer/customer-view/contact-preferences/how-we-speak-to-you/confirm-your-changes-textphone"
      } else {
        window.location.href = "/customer/customer-view/contact-preferences/how-we-speak-to-you/textphone.html"
      }

    }
  </script>

{% endblock %}
