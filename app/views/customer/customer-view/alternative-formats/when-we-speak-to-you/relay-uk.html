{% extends "layouts/main.html" %}

{% block beforeContent %}

{{ govukBackLink({
      text: "Back",
      href: "javascript:window.history.back()"
  }) }}
  
  <ul class="dwp-language-toggle__list">
    <li class="dwp-language-toggle__list-item" aria-current="true"> <span class="govuk-body-s"> English  </span></li>
    <li class="dwp-language-toggle__list-item">    
    <a href="#" hreflang="cy" lang="cy" rel="alternate" class="govuk-link--no-visited-state" aria-label="Newid yr iaith ir Gymraeg">Cymraeg</a>
    </li>
  </ul>

{% endblock %}

{% block content %}

<div class="govuk-form-group">
  <fieldset class="govuk-fieldset">
  <h1 class="govuk-heading-l">
    What is your Relay UK number?
  </h1>

  <label class="govuk-label" for="textphone-number">
   Relay UK number
  </label>
  <input class="govuk-input govuk-input--width-20" id="relay-uk-number" name="relayukNumber" type="relay" autocomplete="relay">
</div>

<button class="govuk-button" value= "true" data-module="govuk-button" style="margin-bottom:50px;" onclick="check3()" >Continue</button>

</fieldset>

  </div>

  <script>
    function check3() {
      var relayNumber = document.getElementById('relay-uk-number');
      sessionStorage.setItem('howWeConnect', `Relay UK<br>${relayNumber.value}`);
      if (document.getElementById("relay-uk-number").value && document.getElementById("relay-uk-number").value ) {
        window.location.href = "/customer/customer-view/alternative-formats/when-we-speak-to-you/confirm-your-changes.html"
      } else {
        window.location.href = "/customer/customer-view/alternative-formats/when-we-speak-to-you/error/relay-uk.html"
      }

    }
  </script>

{% endblock %}
